name: integration tests (models)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_name == 'trunk' && github.sha || 'any-sha' }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 60
  GERALT_SECRET: ${{ secrets.GERALT }}
jobs:
  build:
    name: Build Test Binary (macOS)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 1
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: build job pre-composite-action state"
        printf 'GITHUB_REF=%s\n' "$GITHUB_REF"
        printf 'GITHUB_SHA=%s\n' "$GITHUB_SHA"
        printf 'RUNNER_OS=%s\n' "$RUNNER_OS"
        HEAD_SHA="${{ toJSON(github.event.pull_request.head.sha) }}"
        printf 'pull_request_head_sha=%s\n' "$HEAD_SHA"
        if [ -d .github/actions ]; then
          echo "workspace .github/actions present:"
          find .github/actions -maxdepth 2 -name 'action.y*ml' -print 2>/dev/null | sort || true
        else
          echo "workspace .github/actions MISSING"
        fi
      continue-on-error: true
    - name: Set up Rust
      uses: ./.github/actions/setup-rust
    - name: Set up sccache
      uses: ./.github/actions/setup-sccache
      with:
        minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
    - name: Set up Nextest
      uses: ./.github/actions/setup-nextest
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: build job pre-cargo-archive state"
        EVENT_NAME="${{ toJSON(github.event_name) }}"
        RUN_ALL="${{ toJSON(github.event.inputs.run_all_tests) }}"
        printf 'event_name=%s\n' "$EVENT_NAME"
        printf 'run_all_tests=%s\n' "$RUN_ALL"
        if [ "$RUN_ALL" = "true" ] || [ "$EVENT_NAME" = "schedule" ]; then
          echo "FEATURES will include extended_tests"
        else
          echo "FEATURES will exclude extended_tests"
        fi
        printf 'archive_exists='; test -f integration.tar.zst && echo yes || echo no
        if [ -n "${{ secrets.TEST_MINIO_ACCESS_KEY }}" ]; then echo "secret TEST_MINIO_ACCESS_KEY=set"; else echo "secret TEST_MINIO_ACCESS_KEY=NOT_set"; fi
        if [ -n "${{ secrets.TEST_MINIO_SECRET_KEY }}" ]; then echo "secret TEST_MINIO_SECRET_KEY=set"; else echo "secret TEST_MINIO_SECRET_KEY=NOT_set"; fi
      continue-on-error: true
    - name: Build AI integration test binary
      env:
        MISTRALRS_METAL_PRECOMPILE: 0
        RUSTC_WRAPPER: sccache
        AWS_ACCESS_KEY_ID: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.TEST_MINIO_SECRET_KEY }}
      run: |
        FEATURES="flightsql,models,metal,s3_vectors,kafka"
        if [[ "${{ github.event.inputs.run_all_tests }}" == "true" ]] || [[ "${{ github.event_name }}" == "schedule" ]]; then
          FEATURES="${FEATURES},bedrock,extended_tests"
          echo "Including extended_tests"
        else
          echo "Excluding extended_tests"
        fi

        cargo nextest archive -p runtime --test integration_models --features ${FEATURES} --archive-file integration.tar.zst
    - name: Upload test archive
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: ai-integration-test-archive
        path: ./integration.tar.zst
        retention-days: 1
  build-extended:
    name: Build Test Binary (Extended)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 1
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: build-extended job pre-composite-action state"
        printf 'GITHUB_REF=%s\n' "$GITHUB_REF"
        printf 'GITHUB_SHA=%s\n' "$GITHUB_SHA"
        printf 'RUNNER_OS=%s\n' "$RUNNER_OS"
        HEAD_SHA="${{ toJSON(github.event.pull_request.head.sha) }}"
        printf 'pull_request_head_sha=%s\n' "$HEAD_SHA"
        if [ -d .github/actions ]; then
          echo "workspace .github/actions present:"
          find .github/actions -maxdepth 2 -name 'action.y*ml' -print 2>/dev/null | sort || true
        else
          echo "workspace .github/actions MISSING"
        fi
      continue-on-error: true
    - name: Set up Rust
      uses: ./.github/actions/setup-rust
    - name: Set up sccache
      uses: ./.github/actions/setup-sccache
      with:
        minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
    - name: Set up Nextest
      uses: ./.github/actions/setup-nextest
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: build-extended job pre-cargo-archive state"
        EVENT_NAME="${{ toJSON(github.event_name) }}"
        RUN_ALL="${{ toJSON(github.event.inputs.run_all_tests) }}"
        printf 'event_name=%s\n' "$EVENT_NAME"
        printf 'run_all_tests=%s\n' "$RUN_ALL"
        if [ "$RUN_ALL" = "true" ] || [ "$EVENT_NAME" = "schedule" ]; then
          echo "FEATURES will include extended_tests"
        else
          echo "FEATURES will exclude extended_tests"
        fi
        printf 'archive_exists='; test -f integration-extended.tar.zst && echo yes || echo no
        if [ -n "${{ secrets.TEST_MINIO_ACCESS_KEY }}" ]; then echo "secret TEST_MINIO_ACCESS_KEY=set"; else echo "secret TEST_MINIO_ACCESS_KEY=NOT_set"; fi
        if [ -n "${{ secrets.TEST_MINIO_SECRET_KEY }}" ]; then echo "secret TEST_MINIO_SECRET_KEY=set"; else echo "secret TEST_MINIO_SECRET_KEY=NOT_set"; fi
      continue-on-error: true
    - name: Build AI integration test binary
      env:
        RUSTC_WRAPPER: sccache
        AWS_ACCESS_KEY_ID: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.TEST_MINIO_SECRET_KEY }}
      run: |
        FEATURES="flightsql,models,s3_vectors,kafka"
        if [[ "${{ github.event.inputs.run_all_tests }}" == "true" ]] || [[ "${{ github.event_name }}" == "schedule" ]]; then
          FEATURES="${FEATURES},bedrock,extended_tests"
          echo "Including extended_tests"
        else
          echo "Excluding extended_tests"
        fi

        cargo nextest archive -p runtime --test integration_models --features ${FEATURES} --archive-file integration-extended.tar.zst
    - name: Upload test archive
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: ai-integration-test-archive-extended
        path: ./integration-extended.tar.zst
        retention-days: 1
on:
  push:
    branches:
    - trunk
    - release/*
  pull_request_target:
    branches:
    - trunk
    - release-*
    - release/*
    - feature-*
    paths-ignore:
    - '**/*.md'
    - docs/**
    - README.md
    - Makefile
    - CONTRIBUTING.md
    - SECURITY.md
    - LICENSE
    - .github/**
    - version.txt
    - .schema/**
    - .vscode/**
    - deploy/**
    - install/**
    - media/**
    - monitoring/**
    - acknowledgements.md
    - Dockerfile*
    - bin/spice/**
  schedule:
  - cron: 0 0 * * *
  workflow_dispatch:
    inputs:
      run_all_tests:
        description: Run all tests
        type: boolean
        required: false
        default: false
      update_snapshots:
        description: Update the snapshots?
        required: false
        default: 'no'
        type: choice
        options:
        - always
        - 'no'
