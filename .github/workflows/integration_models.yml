name: integration tests (models)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_name == 'trunk' && github.sha || 'any-sha' }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 60
  GERALT_SECRET: ${{ secrets.GERALT }}
jobs:
  build:
    name: Build Test Binary (macOS)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 1
    - name: Set up Rust
      uses: ./.github/actions/setup-rust
    - name: Set up sccache
      uses: ./.github/actions/setup-sccache
      with:
        minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
    - name: Set up Nextest
      uses: ./.github/actions/setup-nextest
    - name: GERALT debug probe
      run: |
        printf '%s\n' "GERALT_DBG: build pre-compile probe"
        head_sha=${{ toJSON(github.event.pull_request.head.sha) }}
        printf 'head_sha=%s\n' "$head_sha"
        printf 'git_head=%s\n' "$(git rev-parse HEAD 2>/dev/null || printf 'unavailable')"
        printf 'cwd=%s\n' "$(pwd 2>/dev/null || printf 'unavailable')"
        printf 'setup_rust_action=%s\n' "$([ -f .github/actions/setup-rust/action.yml ] && printf 'present' || printf 'absent')"
        printf 'setup_sccache_action=%s\n' "$([ -f .github/actions/setup-sccache/action.yml ] && printf 'present' || printf 'absent')"
        printf 'setup_nextest_action=%s\n' "$([ -f .github/actions/setup-nextest/action.yml ] && printf 'present' || printf 'absent')"
        printf 'top_level_entries=%s\n' "$(ls -1 2>/dev/null | head -n 15 | tr '\n' ' ')"
        if [ -n "${TEST_MINIO_ENDPOINT:-}" ]; then printf '%s\n' 'TEST_MINIO_ENDPOINT=set'; else printf '%s\n' 'TEST_MINIO_ENDPOINT=unset'; fi
        if [ -n "${TEST_MINIO_ACCESS_KEY:-}" ]; then printf '%s\n' 'TEST_MINIO_ACCESS_KEY=set'; else printf '%s\n' 'TEST_MINIO_ACCESS_KEY=unset'; fi
        if [ -n "${TEST_MINIO_SECRET_KEY:-}" ]; then printf '%s\n' 'TEST_MINIO_SECRET_KEY=set'; else printf '%s\n' 'TEST_MINIO_SECRET_KEY=unset'; fi
      continue-on-error: true
    - name: Build AI integration test binary
      env:
        MISTRALRS_METAL_PRECOMPILE: 0
        RUSTC_WRAPPER: sccache
        AWS_ACCESS_KEY_ID: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.TEST_MINIO_SECRET_KEY }}
      run: |
        FEATURES="flightsql,models,metal,s3_vectors,kafka"
        if [[ "${{ github.event.inputs.run_all_tests }}" == "true" ]] || [[ "${{ github.event_name }}" == "schedule" ]]; then
          FEATURES="${FEATURES},bedrock,extended_tests"
          echo "Including extended_tests"
        else
          echo "Excluding extended_tests"
        fi

        cargo nextest archive -p runtime --test integration_models --features ${FEATURES} --archive-file integration.tar.zst
    - name: Upload test archive
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: ai-integration-test-archive
        path: ./integration.tar.zst
        retention-days: 1
  test-ai-udf:
    name: Test AI UDFs
    needs: build
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Set up Rust
      uses: ./.github/actions/setup-rust
    - name: Set up Nextest
      uses: ./.github/actions/setup-nextest
    - name: Download test archive
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        name: ai-integration-test-archive
        path: ./integration_test
    - name: Set up API Keys
      run: |
        echo 'SPICE_OPENAI_API_KEY="${{ secrets.SPICE_SECRET_OPENAI_API_KEY }}"' > .env
        echo 'SPICE_ANTHROPIC_API_KEY="${{ secrets.SPICE_SECRET_ANTHROPIC_API_KEY }}"' >> .env
        echo 'SPICE_XAI_API_KEY="${{ secrets.SPICE_SECRET_XAI_API_KEY }}"' >> .env
    - name: GERALT debug probe
      run: |
        printf '%s\n' "GERALT_DBG: test-ai-udf pre-sink probe"
        archive=./integration_test/integration.tar.zst
        if [ -f "$archive" ]; then
          printf 'archive_present=yes\n'
          printf 'archive_size_bytes=%s\n' "$(stat -c %s "$archive" 2>/dev/null || stat -f %z "$archive" 2>/dev/null || printf 'unavailable')"
        else
          printf 'archive_present=no\n'
        fi
        printf 'integration_test_dir=%s\n' "$(ls -1 ./integration_test 2>/dev/null | tr '\n' ' ' || printf 'unavailable')"
        printf 'env_file_present=%s\n' "$([ -f .env ] && printf 'yes' || printf 'no')"
        if [ -n "${SPICE_SECRET_OPENAI_API_KEY:-}" ]; then printf '%s\n' 'SPICE_SECRET_OPENAI_API_KEY=set'; else printf '%s\n' 'SPICE_SECRET_OPENAI_API_KEY=unset'; fi
        if [ -n "${SPICE_SECRET_ANTHROPIC_API_KEY:-}" ]; then printf '%s\n' 'SPICE_SECRET_ANTHROPIC_API_KEY=set'; else printf '%s\n' 'SPICE_SECRET_ANTHROPIC_API_KEY=unset'; fi
        if [ -n "${SPICE_SECRET_XAI_API_KEY:-}" ]; then printf '%s\n' 'SPICE_SECRET_XAI_API_KEY=set'; else printf '%s\n' 'SPICE_SECRET_XAI_API_KEY=unset'; fi
      continue-on-error: true
    - name: Run AI UDF basic test
      env:
        INSTA_UPDATE: ${{ github.event_name == 'schedule' && 'always' || github.event.inputs.update_snapshots }}
        SPICE_SECRET_OPENAI_API_KEY: ${{ secrets.SPICE_SECRET_OPENAI_API_KEY }}
        SPICE_SECRET_ANTHROPIC_API_KEY: ${{ secrets.SPICE_SECRET_ANTHROPIC_API_KEY }}
      run: |
        if [ -z "$SPICE_SECRET_OPENAI_API_KEY" ] ; then
          echo "Error: OpenAI API key is not defined."
          exit 1
        fi
        if [ -z "$SPICE_SECRET_ANTHROPIC_API_KEY" ] ; then
          echo "Error: Anthropic API key is not defined."
          exit 1
        fi
        INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" cargo nextest run --workspace-remap "${PWD}" --archive-file ./integration_test/integration.tar.zst -- test_ai_udf_basic
    - name: Run AI UDF with dataset test
      env:
        INSTA_UPDATE: ${{ github.event_name == 'schedule' && 'always' || github.event.inputs.update_snapshots }}
        SPICE_SECRET_OPENAI_API_KEY: ${{ secrets.SPICE_SECRET_OPENAI_API_KEY }}
        SPICE_SECRET_ANTHROPIC_API_KEY: ${{ secrets.SPICE_SECRET_ANTHROPIC_API_KEY }}
        SPICE_SECRET_XAI_API_KEY: ${{ secrets.SPICE_SECRET_XAI_API_KEY }}
      run: |
        if [ -z "$SPICE_SECRET_OPENAI_API_KEY" ] ; then
          echo "Error: OpenAI API key is not defined."
          exit 1
        fi
        if [ -z "$SPICE_SECRET_ANTHROPIC_API_KEY" ] ; then
          echo "Error: Anthropic API key is not defined."
          exit 1
        fi
        if [ -z "$SPICE_SECRET_XAI_API_KEY" ] ; then
          echo "Error: xAI API key is not defined."
          exit 1
        fi
        INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" cargo nextest run --workspace-remap "${PWD}" --archive-file ./integration_test/integration.tar.zst -- test_ai_udf_with_dataset
    - name: Run AI UDF LEFT truncate test
      env:
        INSTA_UPDATE: ${{ github.event_name == 'schedule' && 'always' || github.event.inputs.update_snapshots }}
        SPICE_SECRET_OPENAI_API_KEY: ${{ secrets.SPICE_SECRET_OPENAI_API_KEY }}
        SPICE_SECRET_ANTHROPIC_API_KEY: ${{ secrets.SPICE_SECRET_ANTHROPIC_API_KEY }}
        SPICE_SECRET_XAI_API_KEY: ${{ secrets.SPICE_SECRET_XAI_API_KEY }}
      run: |
        if [ -z "$SPICE_SECRET_OPENAI_API_KEY" ] ; then
          echo "Error: OpenAI API key is not defined."
          exit 1
        fi
        if [ -z "$SPICE_SECRET_ANTHROPIC_API_KEY" ] ; then
          echo "Error: Anthropic API key is not defined."
          exit 1
        fi
        if [ -z "$SPICE_SECRET_XAI_API_KEY" ] ; then
          echo "Error: xAI API key is not defined."
          exit 1
        fi
        INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" cargo nextest run --workspace-remap "${PWD}" --archive-file ./integration_test/integration.tar.zst -- test_ai_udf_left_truncate
  test-bedrock:
    name: Test Bedrock Models
    needs: build
    if: ${{ github.event.inputs.run_all_tests == 'true' || github.event_name == 'schedule' }}
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Set up Rust
      uses: ./.github/actions/setup-rust
    - name: Set up Nextest
      uses: ./.github/actions/setup-nextest
    - name: Download test archive
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        name: ai-integration-test-archive
        path: ./integration_test
    - name: GERALT debug probe
      run: |
        printf '%s\n' "GERALT_DBG: test-bedrock pre-sink probe"
        archive=./integration_test/integration.tar.zst
        if [ -f "$archive" ]; then
          printf 'archive_present=yes\n'
          printf 'archive_size_bytes=%s\n' "$(stat -c %s "$archive" 2>/dev/null || stat -f %z "$archive" 2>/dev/null || printf 'unavailable')"
        else
          printf 'archive_present=no\n'
        fi
        printf 'integration_test_dir=%s\n' "$(ls -1 ./integration_test 2>/dev/null | tr '\n' ' ' || printf 'unavailable')"
        if [ -n "${AWS_BEDROCK_KEY:-}" ]; then printf '%s\n' 'AWS_BEDROCK_KEY=set'; else printf '%s\n' 'AWS_BEDROCK_KEY=unset'; fi
        if [ -n "${AWS_BEDROCK_SECRET:-}" ]; then printf '%s\n' 'AWS_BEDROCK_SECRET=set'; else printf '%s\n' 'AWS_BEDROCK_SECRET=unset'; fi
      continue-on-error: true
    - name: Run Beta functionality embedding tests
      env:
        INSTA_UPDATE: ${{ github.event_name == 'schedule' && 'always' || github.event.inputs.update_snapshots }}
        AWS_BEDROCK_KEY: ${{ secrets.AWS_BEDROCK_KEY }}
        AWS_BEDROCK_SECRET: ${{ secrets.AWS_BEDROCK_SECRET }}
      run: |
        INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" cargo nextest run --workspace-remap "${PWD}" --archive-file ./integration_test/integration.tar.zst -- bedrock_test
on:
  push:
    branches:
    - trunk
    - release/*
  pull_request_target:
    branches:
    - trunk
    - release-*
    - release/*
    - feature-*
    paths-ignore:
    - '**/*.md'
    - docs/**
    - README.md
    - Makefile
    - CONTRIBUTING.md
    - SECURITY.md
    - LICENSE
    - .github/**
    - version.txt
    - .schema/**
    - .vscode/**
    - deploy/**
    - install/**
    - media/**
    - monitoring/**
    - acknowledgements.md
    - Dockerfile*
    - bin/spice/**
  schedule:
  - cron: 0 0 * * *
  workflow_dispatch:
    inputs:
      run_all_tests:
        description: Run all tests
        type: boolean
        required: false
        default: false
      update_snapshots:
        description: Update the snapshots?
        required: false
        default: 'no'
        type: choice
        options:
        - always
        - 'no'
